sonar.projectKey=notes-app
sonar.projectName=Notes App
sonar.sourceEncoding=UTF-8
sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/test,apps/web/src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.coverage.exclusions=**/main.tsx,**/server.ts,**/*.d.ts
